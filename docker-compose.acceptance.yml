services:
  backend:
    environment:
      # Acceptance-only operational sizing. Semantic algorithms and frozen
      # decision thresholds remain unchanged.
      SEMANTIC_QUEUE_MAXSIZE: ${SEMANTIC_QUEUE_MAXSIZE:-2}
      INGEST_QUEUE_MAXSIZE: ${INGEST_QUEUE_MAXSIZE:-512}
      INGEST_WORKERS: ${INGEST_WORKERS:-16}
      SEMANTIC_DISCOVERY_DEBOUNCE_SECONDS: ${SEMANTIC_DISCOVERY_DEBOUNCE_SECONDS:-0.2}
      SEMANTIC_PERSISTENCE_SAVE_DEBOUNCE_SECONDS: ${SEMANTIC_PERSISTENCE_SAVE_DEBOUNCE_SECONDS:-0.2}
      SEMANTIC_PERSISTENCE_STATE_KEY: ${SEMANTIC_PERSISTENCE_STATE_KEY:-acceptance-local}
      RECOVERY_BASE_DELAY: ${RECOVERY_BASE_DELAY:-1.0}
      RECOVERY_MAX_DELAY: ${RECOVERY_MAX_DELAY:-4.0}
