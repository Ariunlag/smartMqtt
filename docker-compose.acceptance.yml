services:
  backend:
    environment:
      # Acceptance-only operational sizing. Recommendation scoring remains
      # unchanged; the shorter duplicate delay keeps the test bounded.
      CLASS_RECOMMENDATION_QUEUE_MAXSIZE: ${CLASS_RECOMMENDATION_QUEUE_MAXSIZE:-128}
      INGEST_QUEUE_MAXSIZE: ${INGEST_QUEUE_MAXSIZE:-512}
      INGEST_WORKERS: ${INGEST_WORKERS:-16}
      DUPE_CHECK_DELAY: ${DUPE_CHECK_DELAY:-1}
      ID_THRESH: ${ID_THRESH:-0.8}
      RECOVERY_BASE_DELAY: ${RECOVERY_BASE_DELAY:-1.0}
      RECOVERY_MAX_DELAY: ${RECOVERY_MAX_DELAY:-4.0}
