services:
  backend:
    environment:
      # Acceptance-only operational sizing. Evidence scoring stays unchanged;
      # these values keep delayed duplicate checks and small discovery fixtures bounded.
      CLASS_RECOMMENDATION_QUEUE_MAXSIZE: ${CLASS_RECOMMENDATION_QUEUE_MAXSIZE:-128}
      INGEST_QUEUE_MAXSIZE: ${INGEST_QUEUE_MAXSIZE:-512}
      INGEST_WORKERS: ${INGEST_WORKERS:-16}
      DUPE_CHECK_DELAY: ${DUPE_CHECK_DELAY:-1}
      ID_THRESH: ${ID_THRESH:-0.8}
      RECOVERY_BASE_DELAY: ${RECOVERY_BASE_DELAY:-1.0}
      RECOVERY_MAX_DELAY: ${RECOVERY_MAX_DELAY:-4.0}
      # Normal user-facing discovery hides acceptance/* by default. The acceptance
      # stack explicitly clears that policy so this harness can discover its fixture.
      SYSTEM_RECOMMENDATION_EXCLUDED_TOPIC_PREFIXES: ""
      SYSTEM_RECOMMENDATION_MIN_CLUSTER_SIZE: ${SYSTEM_RECOMMENDATION_MIN_CLUSTER_SIZE:-2}
      SYSTEM_RECOMMENDATION_MIN_SAMPLES: ${SYSTEM_RECOMMENDATION_MIN_SAMPLES:-1}
      SYSTEM_RECOMMENDATION_ALLOW_SINGLE_CLUSTER: ${SYSTEM_RECOMMENDATION_ALLOW_SINGLE_CLUSTER:-true}
      SYSTEM_RECOMMENDATION_TAG_VALUE_CENTROID_THRESHOLD: ${SYSTEM_RECOMMENDATION_TAG_VALUE_CENTROID_THRESHOLD:-0.85}
      SYSTEM_RECOMMENDATION_TAG_VALUE_CENTROID_MIN_TOPICS: ${SYSTEM_RECOMMENDATION_TAG_VALUE_CENTROID_MIN_TOPICS:-2}
