services:
  postgres:
    image: postgres:16-alpine
    container_name: influxai_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-influxai}
      POSTGRES_USER: ${POSTGRES_USER:-influxai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-influxai-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U influxai -d influxai"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: influxai_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ": >/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10

  influxdb:
    image: influxdb:2.7
    container_name: influxai_influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_INIT_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-influxai}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-smartHub}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-supersecret-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    container_name: influxai_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off schema migration job. Runs `alembic upgrade head` and exits; the
  # backend waits for it to complete successfully. In production this maps to a
  # separate migration job so backend replicas never own schema themselves.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: influxai_migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://influxai:influxai-password@postgres:5432/influxai}

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: influxai_backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      INFLUX_URL: http://influxdb:8086
      INFLUX_BUCKET: ${INFLUX_BUCKET:-smartHub}
      INFLUX_ORG: ${INFLUX_ORG:-influxai}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-supersecret-token}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://influxai:influxai-password@postgres:5432/influxai}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
    volumes:
      - embedding-model-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      # Gate on readiness (required dependencies healthy), not just liveness.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: influxai_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  influxdb-data:
  postgres-data:
  qdrant-data:
  embedding-model-cache:
